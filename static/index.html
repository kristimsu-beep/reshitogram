<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b141a"><title>Решитограм</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="toast" class="toast"></div>
<section id="auth" class="auth-wrap"><div class="brand"><div class="logo">R</div><div><h1>Решитограм</h1><p>Оставайся на связи.</p></div></div><div class="auth-card"><div class="tabs"><button id="loginTab" class="selected">Войти</button><button id="registerTab">Создать аккаунт</button></div><form id="authForm"><div id="registerFields" class="hidden"><label>Никнейм<input id="nickname" minlength="2" maxlength="32" required></label><label>Возраст<input id="age" type="number" min="13" max="120" required></label></div><label>Имя пользователя<input id="username" minlength="3" maxlength="24" autocomplete="username" required></label><label>Пароль<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="primary full" id="submitAuth">Войти</button></form></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><header><div class="brandmini"><div class="logo smalllogo">R</div><b>Решитограм</b></div><button id="logout" class="ghost">↪</button></header><div class="me"><div class="avatar" id="myAvatar">R</div><div><b id="myName"></b><small id="myHandle"></small></div></div><input id="search" class="search" placeholder="Поиск пользователей…"><div id="searchResults" class="results hidden"></div><div class="section">СООБЩЕНИЯ</div><div id="contacts" class="contacts"></div><button id="openAI" class="ai"><span>✦</span><div><b>Reshitogram AI</b><small>Чат · картинки · погода</small></div>›</button></aside>
<main class="main"><div id="empty" class="empty"><div class="hero">R<span>✦</span></div><h2>Добро пожаловать</h2><p>Выбери контакт или начни разговор с Reshitogram AI.</p></div><section id="chat" class="chat hidden"><header class="chathead"><button id="back" class="ghost back">‹</button><div id="chatAvatar" class="avatar">R</div><div class="person"><b id="chatName"></b><small id="chatStatus"></small></div><button id="weatherBtn" class="ghost">☼</button><button id="callBtn" class="ghost">♧</button></header><div id="messages" class="messages"></div><div id="aiTools" class="aitools hidden"><button data-tool="weather">☼ Погода</button><button data-tool="image">✦ Создать картинку</button></div><form id="sendForm" class="composer"><button type="button" id="toolsBtn" class="ghost">＋</button><input id="message" maxlength="6000" placeholder="Напиши сообщение…" autocomplete="off"><button class="send">➤</button></form></section></main></div>
<div id="weatherModal" class="modal hidden"><div class="modalcard"><button id="closeModal" class="close">×</button><h3>Погода</h3><form id="weatherForm"><label>Город<input id="place" placeholder="Tel Aviv"></label><p class="muted">Или укажи обе координаты</p><div class="coords"><label>Широта<input id="lat" type="number" min="-90" max="90" step="any" placeholder="32.0853"></label><label>Долгота<input id="lon" type="number" min="-180" max="180" step="any" placeholder="34.7818"></label></div><button class="primary full">Узнать погоду</button></form><div id="weatherResult"></div></div></div><script src="/static/app.js"></script></body></html>
